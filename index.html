  <title>Рантье</title>
  <style>
    html, body { background: #0b0a08; margin: 0; }
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
      background: radial-gradient(90% 60% at 50% 38%, #1f1b15 0%, #0b0a08 70%);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    #splash.s-out { opacity: 0; transform: scale(1.03); }
    #splash .s-mark { width: 72px; height: 72px; opacity: 0; animation: s-mark 1s cubic-bezier(0.22,1,0.36,1) 0.1s forwards; }
    #splash .s-word {
      font-family: 'Cormorant Garamond Variable', 'Cormorant Garamond', Georgia, serif;
      font-weight: 400; font-size: 44px; color: #efe7d8; letter-spacing: 0.5em; padding-left: 0.5em;
      opacity: 0; animation: s-word 1.1s cubic-bezier(0.22,1,0.36,1) 0.45s forwards;
    }
    #splash .s-tag {
      font-family: 'Manrope Variable', system-ui, sans-serif; font-size: 11px; font-weight: 600;
      letter-spacing: 0.28em; text-transform: uppercase; color: #7f7666;
      opacity: 0; animation: s-fade 0.8s ease 0.95s forwards;
    }
    @keyframes s-mark { from { opacity: 0; transform: translateY(8px) scale(0.92); } to { opacity: 1; transform: none; } }
    @keyframes s-word { from { opacity: 0; letter-spacing: 0.9em; } to { opacity: 1; letter-spacing: 0.14em; padding-left: 0.14em; } }
    @keyframes s-fade { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { #splash * { animation-duration: 1ms !important; animation-delay: 0s !important; } }
  </style>
  <!-- SPA redirect restore (works with 404.html for GitHub Pages) -->
  <script>
    (function(l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function(s) {
          return s.replace(/~and~/g, '&')
        }).join('?');
        window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
      }
    }(window.location))
  </script>
</head>
<body>
  <!-- Branded startup splash: shown once per brand version, removed by main.tsx. -->

    <div class="s-word">Рантье</div>

  <script>try{if(localStorage.getItem('rt-splash-seen'))document.getElementById('splash').style.display='none'}catch(e){}</script>

</html>
